name: Live site health
on:
  schedule:
    - cron: '19 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-health
  cancel-in-progress: true
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/links.mjs
      - name: Verify live content, HTTPS and canonical redirect
        run: python3 scripts/live.py
