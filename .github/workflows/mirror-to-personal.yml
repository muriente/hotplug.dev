name: Mirror to muriente/hotplug.dev-mirror

# Pushes main (only) to Juan's personal copy. gh-pages and Dependabot
# branches are intentionally never mirrored.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-to-personal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'tunless/hotplug.dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Push main to mirror
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes'
          git push git@github.com:muriente/hotplug.dev-mirror.git refs/remotes/origin/main:refs/heads/main
